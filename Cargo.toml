# `SPEC-MOK-002` rule 1 as amended: the repository is a Cargo workspace of exactly two
# packages. The engine package stays at the root, keeps its name and both of its target
# names, and keeps its sources where they are; `mokiterions-tui` is the only other member.
# `SPEC-MOK-003` owns the observer package and `ADR-MOK-003` decides the split.
[workspace]
members = ["mokiterions-tui"]

[package]
name = "Mokiterions"
version = "0.1.0"
edition = "2024"

# SPEC-MOK-002 rule 2: the library target is named in snake case because the declared
# lint gate implies `non_snake_case`; the binary target keeps the operator-facing name
# that appears in the first line of `USAGE`.
[lib]
name = "mokiterions"
path = "src/lib.rs"

[[bin]]
name = "Mokiterions"
path = "src/main.rs"

# `ARCH-MOK-001` as amended requires this table to stay empty, with no exception,
# including a dependency shared with `mokiterions-tui`. `cargo tree -p Mokiterions` is
# the check, and `REQ-MOK-026` is the requirement it discharges.
[dependencies]
