# Refuse a workflow definition that could spend money at a model provider.
#
# This workflow is repository-owned and implements `REQ-MOK-073` with `SPEC-MOK-007` rule
# 13.6. It carries `VER-MOK-018` cases L21a and L21b, in two jobs and in that order: the
# first refuses a definition that could spend, and the second is the definition that
# exercises the model-backed source without spending. They belong in one file because the
# requirement's two halves only mean something together -- a repository whose automation
# never runs the engine satisfies the first half vacuously, and the second half is what
# stops that from reading as containment.
#
# A third job was added on 2026-08-24 and carries L4, L5, L6, L12, L13, L14, L15a and L17
# over the committed transcript. It is here rather than in a file of its own because every
# one of those cases is a statement about the artifact this workflow's second job replays,
# and because the reason it can run for nothing is the same reason that job can. It was
# added because the program it runs, `scripts/check_transcript_reading.py`, had no caller:
# a check nothing invokes is a check that passes for as long as nobody looks.
#
# Why a workflow and not a test: the requirement's subject is the repository's automation,
# so the check has to be able to refuse a change to this directory, and it has to refuse it
# on the pull request that proposes it rather than after the merge. `REQ-MOK-073`'s
# *Failure and boundary behavior* says exactly that.
#
# What this workflow deliberately does NOT do:
#
#   * establish that the credential is absent from the repository's Actions secrets. It
#     cannot see them and neither can the program it runs. That absence is the condition
#     the whole containment rests on, `REQ-MOK-073`'s *Constraints* records it, and
#     `VER-MOK-018` carries it as an owner attestation rather than as a check. A green run
#     here means no workflow asks for a credential. It does not mean none exists.
#
#   * establish that the committed transcript is the recording it claims to be, or that
#     replaying it reproduces that run. Both are byte comparisons and both live in
#     `mokiterions-core/tests/replay.rs`, where the run can be recorded in-process and
#     compared against the file. The second job below runs the replay to establish that a
#     workflow can exercise this source at all; it asserts nothing about the output.
#
#   * touch `engineering-harness.yml` -- that file is managed, listed in
#     `.engineering-harness.lock`, and its `governor` job would report an edit as
#     tampering. This workflow is added beside it, exactly as
#     `dependency-declarations.yml` was under `SPEC-MOK-005` rule 15.3.
#
#   * approve anything. It is evidence, not authority. Whether automation may ever spend is
#     the repository owner's decision, taken as an amendment to `REQ-MOK-073`, and it is not
#     taken by adding a secret.
#
# It fails closed. A missing directory, a directory holding no definition, and a file that
# cannot be decoded are refusals, because a scan that examined nothing must not report that
# it found nothing.

name: Provider credentials

on:
  # Every pull request, for the reason above. `dependency-declarations.yml` stops there and
  # says why: a resolved dependency graph is only meaningful against a proposed change.
  # This check differs, and the difference is deliberate. A credential reference on the
  # integration branch is a live hazard however it arrived, including by a direct push that
  # no pull request ever described, so the integration branch is watched as well.
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # A superseded head is a stale fact about a tree nobody is proposing any more.
  group: provider-credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-holds-no-credential:
    name: Automation holds no credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # For a pull request the default is the prospective merge commit, which is the
        # right subject: the question is what the automation would ask for if this landed.

      - name: Which commit this run is a fact about
        shell: bash
        run: |
          # A refusal is a fact about a commit, so the commit is named before any check
          # runs rather than left for a reader to infer from the event.
          echo "event           ${{ github.event_name }}"
          echo "commit          $(git rev-parse HEAD)"
          echo "ref             ${{ github.ref }}"

      - name: The scan itself works
        run: python3 scripts/test_check_workflow_credentials.py
        # This step exists because of what the next one checks. `REQ-MOK-073`'s subject is
        # an absence, and a scan whose patterns never match reports the same thing as a
        # repository that asks for nothing: success. So the scan's own scenario suite runs
        # first, and it plants a reference of every shape the next step is supposed to
        # catch. A pull request that weakened the patterns fails here rather than passing
        # there. The suite also scans this repository's real definitions, so it is the same
        # verdict twice by two routes, on purpose.

      - name: No definition asks for a provider credential or selects live mode
        run: python3 scripts/check_workflow_credentials.py --root .
        # Five scans: one per clause of `REQ-MOK-073`'s *Required response* item 2, one for
        # its live-mode prohibition, and one for item 3. Not as a secret; not as an
        # environment variable or input; not through a step that brokers one from outside
        # the repository; no live-run option and no selection that does not name a committed
        # transcript on the same line; and at least one definition that does select the
        # source that way, which is the job below. Every refusal names the file, the line,
        # the line's text and the clause. Comment lines are not scanned, which is what lets
        # this file explain the prohibition without tripping over its own statement -- and
        # also why the job below has to state its selection on one scanned line.

      - name: The check leaves the tree as it found it
        if: always()
        shell: bash
        run: |
          # A log, not a check -- the program writes nothing and its suite asserts as much
          # in a temporary tree. Printing this at the job's edge makes a difference visible
          # in the transcript rather than inferred from an exit code.
          git status --porcelain --untracked-files=all

  # `VER-MOK-018` case L21b: the model-backed source is exercised by automation, and doing so
  # costs nothing. This is `REQ-MOK-073`'s *Required response* item 3 -- "any workflow step
  # that exercises the model-backed source does so in replay mode against a transcript
  # committed to the repository" -- and it is the step the sentence is about.
  #
  # `SPEC-MOK-007` rule 12.2 is what makes it safe on a runner: a replay makes no provider
  # call, opens no socket, spawns no connector and reads no credential, whether or not a
  # credential is present in the environment. Nothing is granted to this job beyond the
  # read-only `contents` permission above, so a step that tried to reach a provider would
  # fail rather than spend -- but rule 12.2 is why it does not try.
  #
  # A separate job, not a step in the one above, for two reasons: that job establishes an
  # absence and must stay fast and free of a compiler, and a green tick here is a different
  # fact from a green tick there.
  the-source-is-exercised-without-spending:
    name: The model-backed source runs in replay mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replay the committed transcript
        shell: bash
        # One line, and it has to be. `scripts/check_workflow_credentials.py` reads one line
        # at a time and joins none, so a command split across a block scalar would state
        # `--policy llm` on one line and its transcript on another, and the check would
        # refuse it as a selection whose transcript it cannot see. The configuration matches
        # `RECORDED_RUN` in `mokiterions-core/tests/replay.rs` exactly; a mismatch is
        # `SPEC-MOK-007` rule 12.3 and fails at the first opportunity rather than silently.
        # Standard output goes outside the tree because it is the run's whole trace, ~300 KB
        # of it, and because nothing here is a fact about its content.
        run: cargo run --quiet -p Mokiterions -- --policy llm --transcript-path mokiterions-core/tests/transcript-seed0-ticks20-hunting.jsonl --seed 0 --ticks 20 --trace-actions > "$RUNNER_TEMP/replay.txt"

      - name: What the replay produced
        shell: bash
        run: |
          # The summary line and the count, so a reader of a green log can see that a run
          # happened rather than that a command exited. `SPEC-MOK-007` rule 12.6's byte
          # identity is asserted in `tests/replay.rs`, not here.
          echo "lines           $(wc -l < "$RUNNER_TEMP/replay.txt")"
          tail -n 1 "$RUNNER_TEMP/replay.txt"

  # `VER-MOK-018` cases L4, L5, L6, L12, L13, L14, L15a and L17, every one of which states
  # its condition over a *retained* transcript -- the file a reviewer can open, not the
  # objects the engine held while composing it. The engine's own tiers check the
  # composition; these cases check the artifact, and `scripts/check_transcript_reading.py`
  # explains at length why those are not the same fact.
  #
  # A separate job, and no compiler in it. It reads one committed file with the standard
  # library, so it is the cheapest job in this repository and it stays green or red for
  # reasons that have nothing to do with a toolchain. It reaches no network and reads no
  # credential, which is a property of the program rather than of this job's permissions --
  # though the read-only `contents` permission above applies here too.
  #
  # Nothing here establishes that the transcript is the run it claims to be, or that two
  # transcripts of one recorded run compare equal. Both are byte comparisons against a
  # run recorded in-process, both live in `mokiterions-core/tests/replay.rs`, and the
  # program says so in its own output rather than leaving it to be inferred.
  the-retained-transcript-carries-what-it-must:
    name: The retained transcript carries what the contract requires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The reader itself works
        run: python3 scripts/test_check_transcript_reading.py
        # The same argument as "The scan itself works" above, for the same reason. Six of
        # these eight cases are satisfied by a reader that parses nothing and reports
        # success, so the suite runs first and puts malformed, truncated and
        # deliberately-wrong transcripts to the reader. A change that weakened the
        # recomputation fails here rather than passing below.

      - name: The committed transcript satisfies the eight cases
        run: python3 scripts/check_transcript_reading.py mokiterions-core/tests/transcript-seed0-ticks20-hunting.jsonl
        # The transcript named is the one the job above replays, so a change to it is
        # answered by both jobs: this one says the file still carries what the contract
        # requires of a request, and that one says a host can still replay it. The path is
        # written out rather than shared through an environment variable because
        # `scripts/check_workflow_credentials.py` reads one line at a time and joins none.

      - name: The check leaves the tree as it found it
        if: always()
        shell: bash
        run: |
          # A log, not a check -- the program writes nothing. Printing it at the job's edge
          # makes a difference visible in the transcript rather than inferred from an exit
          # code, exactly as the first job does.
          git status --porcelain --untracked-files=all
