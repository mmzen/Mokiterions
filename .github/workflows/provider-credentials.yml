# Refuse a workflow definition that could spend money at a model provider.
#
# This workflow is repository-owned and implements `REQ-MOK-073` with `SPEC-MOK-007` rule
# 13.6. It carries `VER-MOK-018` case L21a and nothing else.
#
# Why a workflow and not a test: the requirement's subject is the repository's automation,
# so the check has to be able to refuse a change to this directory, and it has to refuse it
# on the pull request that proposes it rather than after the merge. `REQ-MOK-073`'s
# *Failure and boundary behavior* says exactly that.
#
# What this workflow deliberately does NOT do:
#
#   * establish that the credential is absent from the repository's Actions secrets. It
#     cannot see them and neither can the program it runs. That absence is the condition
#     the whole containment rests on, `REQ-MOK-073`'s *Constraints* records it, and
#     `VER-MOK-018` carries it as an owner attestation rather than as a check. A green run
#     here means no workflow asks for a credential. It does not mean none exists.
#
#   * carry `VER-MOK-018` case L21b, that a workflow step exercises the model-backed source
#     in replay mode. That case needs the committed transcript of `WO-MOK-025` item 12, and
#     the step arrives with it. The program prints the gap on every successful run, so a
#     reader of a green log is told which half of the requirement was established.
#
#   * touch `engineering-harness.yml` -- that file is managed, listed in
#     `.engineering-harness.lock`, and its `governor` job would report an edit as
#     tampering. This workflow is added beside it, exactly as
#     `dependency-declarations.yml` was under `SPEC-MOK-005` rule 15.3.
#
#   * approve anything. It is evidence, not authority. Whether automation may ever spend is
#     the repository owner's decision, taken as an amendment to `REQ-MOK-073`, and it is not
#     taken by adding a secret.
#
# It fails closed. A missing directory, a directory holding no definition, and a file that
# cannot be decoded are refusals, because a scan that examined nothing must not report that
# it found nothing.

name: Provider credentials

on:
  # Every pull request, for the reason above. `dependency-declarations.yml` stops there and
  # says why: a resolved dependency graph is only meaningful against a proposed change.
  # This check differs, and the difference is deliberate. A credential reference on the
  # integration branch is a live hazard however it arrived, including by a direct push that
  # no pull request ever described, so the integration branch is watched as well.
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # A superseded head is a stale fact about a tree nobody is proposing any more.
  group: provider-credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-holds-no-credential:
    name: Automation holds no credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # For a pull request the default is the prospective merge commit, which is the
        # right subject: the question is what the automation would ask for if this landed.

      - name: Which commit this run is a fact about
        shell: bash
        run: |
          # A refusal is a fact about a commit, so the commit is named before any check
          # runs rather than left for a reader to infer from the event.
          echo "event           ${{ github.event_name }}"
          echo "commit          $(git rev-parse HEAD)"
          echo "ref             ${{ github.ref }}"

      - name: The scan itself works
        run: python3 scripts/test_check_workflow_credentials.py
        # This step exists because of what the next one checks. `REQ-MOK-073`'s subject is
        # an absence, and a scan whose patterns never match reports the same thing as a
        # repository that asks for nothing: success. So the scan's own scenario suite runs
        # first, and it plants a reference of every shape the next step is supposed to
        # catch. A pull request that weakened the patterns fails here rather than passing
        # there. The suite also scans this repository's real definitions, so it is the same
        # verdict twice by two routes, on purpose.

      - name: No definition asks for a provider credential or selects live mode
        run: python3 scripts/check_workflow_credentials.py --root .
        # Four scans, one per clause of `REQ-MOK-073`'s *Required response* item 2 and its
        # live-mode prohibition: not as a secret, not as an environment variable or input,
        # not through a step that brokers one from outside the repository, and no selection
        # of a live run. Every refusal names the file, the line, the line's text and the
        # clause. Comment lines are not scanned, which is what lets this file explain the
        # prohibition without tripping over its own statement.

      - name: The check leaves the tree as it found it
        if: always()
        shell: bash
        run: |
          # A log, not a check -- the program writes nothing and its suite asserts as much
          # in a temporary tree. Printing this at the job's edge makes a difference visible
          # in the transcript rather than inferred from an exit code.
          git status --porcelain --untracked-files=all
