# Install the exact released evaluator. Read the live pull-request body.
# Check the selected work orders and combined PR scope. Qualify the root with
# its exact released evaluator. Generate Harness Explorer. Upload the
# harness-dashboard artifact. Trigger policy: pull requests, and pushes to
# main, release/** and candidate/** only; newer runs cancel older ones.
name: Engineering Harness

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "candidate/**"

concurrency:
  group: engineering-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SE_HARNESS_VERSION: "0.18.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the exact released evaluator
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/se-harness-env"
          "$RUNNER_TEMP/se-harness-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            "se-harness==$SE_HARNESS_VERSION"
      - name: Read the live pull-request body
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # ECP-LPB-002, -003: the declarations are selected from the pull request
          # as it is now, not from the stored trigger snapshot, so a corrected
          # body is honoured by re-running this check without a new push.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            > "$RUNNER_TEMP/pull-request.json"
          "$RUNNER_TEMP/se-harness-env/bin/python" - "$RUNNER_TEMP/pull-request.json" "$RUNNER_TEMP/live-event.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              pull_request = json.load(source)
          with open(sys.argv[2], "w", encoding="utf-8") as target:
              json.dump({"pull_request": {"body": pull_request.get("body")}}, target)
          PY
      - name: Check the selected work orders and combined PR scope
        if: github.event_name == 'pull_request'
        env:
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git fetch --depth=1 origin "$HARNESS_BASE_SHA"
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness check-pr . \
            --event "$RUNNER_TEMP/live-event.json" --from-git "$HARNESS_BASE_SHA" --json
      - name: Qualify the root with its exact released evaluator
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness \
            qualify released-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/released-root-qualification.json" \
            --json
      - name: Generate Harness Explorer
        run: |
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness dashboard .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harness-dashboard
          path: |
            target/harness-dashboard
            ${{ runner.temp }}/released-root-qualification.json
